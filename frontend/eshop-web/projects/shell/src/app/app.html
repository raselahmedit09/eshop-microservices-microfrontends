<header class="topbar">
  <a class="brand" routerLink="/">eShop</a>
  <nav aria-label="Main">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/cart" routerLinkActive="active" ariaCurrentWhenActive="page">Cart</a>
      <a routerLink="/orders" routerLinkActive="active" ariaCurrentWhenActive="page">My orders</a>
    }
    <!-- Hiding the link is only a convenience; the backend's Admin policy is the real check -->
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Admin</a>
    }
  </nav>

  <div class="account">
    @if (auth.isLoggedIn()) {
      <span>{{ auth.displayName() }}</span>
      <button type="button" (click)="auth.logout()">Log out</button>
    } @else {
      <button type="button" (click)="auth.login()">Log in / Sign up</button>
    }
  </div>
</header>

<!-- Remote routes (catalog, basket, orders) render here -->
<main class="content">
  <router-outlet />
</main>
